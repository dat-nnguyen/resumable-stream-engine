version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: resumable-stream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stream_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stream_engine"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
